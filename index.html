<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AJATRON AI Smart Home</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    background:#02040a;
    overflow-x:hidden;
}

/* ================= AI BACKGROUND ================= */

.ai-background{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;

    background:
        radial-gradient(circle at 50% 20%,#12345c 0%,#050b18 40%,#010207 100%);
}

/* futuristic grid */

.grid{
    position:absolute;
    width:200%;
    height:200%;
    left:-50%;
    top:30%;

    background-image:
        linear-gradient(rgba(0,220,255,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,220,255,.08) 1px,transparent 1px);

    background-size:55px 55px;

    transform:perspective(500px) rotateX(65deg);

    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{

    from{
        transform:perspective(500px) rotateX(65deg)
        translateY(0);
    }

    to{
        transform:perspective(500px) rotateX(65deg)
        translateY(55px);
    }
}

/* glow */

.ai-background::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;

    left:50%;
    top:30%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:rgba(0,200,255,.12);

    filter:blur(100px);

    animation:pulse 5s infinite alternate;
}

@keyframes pulse{

    from{
        transform:translate(-50%,-50%) scale(.8);
    }

    to{
        transform:translate(-50%,-50%) scale(1.2);
    }
}

/* scanning line */

.scan{
    position:absolute;
    width:100%;
    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            cyan,
            white,
            cyan,
            transparent
        );

    box-shadow:0 0 20px cyan;

    animation:scan 5s linear infinite;
}

@keyframes scan{

    from{
        top:-5%;
    }

    to{
        top:105%;
    }
}

/* particles */

.particle{
    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 10px cyan,
        0 0 25px cyan;

    animation:particleMove linear infinite;
}

.p1{left:5%;animation-duration:9s;}
.p2{left:15%;animation-duration:13s;}
.p3{left:28%;animation-duration:10s;}
.p4{left:42%;animation-duration:15s;}
.p5{left:55%;animation-duration:11s;}
.p6{left:68%;animation-duration:14s;}
.p7{left:80%;animation-duration:9s;}
.p8{left:94%;animation-duration:12s;}

@keyframes particleMove{

    from{
        top:110%;
        opacity:0;
    }

    15%{
        opacity:1;
    }

    85%{
        opacity:1;
    }

    to{
        top:-10%;
        opacity:0;
    }
}

/* ================= MAIN ================= */

.container{
    width:92%;
    max-width:1150px;
    margin:auto;
}

/* ================= HEADER ================= */

header{
    text-align:center;
    padding:45px 10px 25px;
}

.logo{
    font-size:58px;
    letter-spacing:12px;

    color:white;

    text-shadow:
        0 0 10px cyan,
        0 0 30px #008cff,
        0 0 70px cyan;

    animation:logoGlow 2s infinite alternate;
}

@keyframes logoGlow{

    from{
        text-shadow:
            0 0 10px cyan,
            0 0 30px #008cff;
    }

    to{
        text-shadow:
            0 0 20px cyan,
            0 0 60px cyan,
            0 0 100px #0077ff;
    }
}

.subtitle{
    margin-top:10px;
    letter-spacing:5px;
    color:#80edff;
}

.connection{
    display:inline-block;

    margin-top:20px;

    padding:10px 20px;

    border:1px solid rgba(0,255,255,.3);

    border-radius:30px;

    background:rgba(0,30,60,.5);

    box-shadow:0 0 20px rgba(0,200,255,.15);
}

/* ================= AI PANEL ================= */

.panel{

    margin:20px 0;

    padding:25px;

    border-radius:22px;

    background:rgba(5,20,45,.62);

    border:1px solid rgba(0,220,255,.25);

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 30px rgba(0,180,255,.12),
        inset 0 0 30px rgba(0,180,255,.03);
}

.panel h2{
    text-align:center;
    margin-bottom:15px;
}

/* ================= VOICE ================= */

.voiceButton{

    display:block;

    margin:auto;

    padding:17px 32px;

    border:none;

    border-radius:50px;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            90deg,
            #00c6ff,
            #0066ff
        );

    box-shadow:
        0 0 20px rgba(0,200,255,.5);

    transition:.2s;
}

.voiceButton:hover{
    transform:scale(1.05);
}

.voiceText{
    text-align:center;
    margin-top:15px;
    color:#b8dff0;
}

/* ================= DEVICES ================= */

.devices{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px,1fr)
        );

    gap:20px;

    margin-top:20px;
}

.device{

    text-align:center;

    padding:30px 20px;

    border-radius:20px;

    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.12);

    transition:.25s;

    position:relative;

    overflow:hidden;
}

.device::before{

    content:"";

    position:absolute;

    width:100%;
    height:2px;

    top:0;
    left:-100%;

    background:linear-gradient(
        90deg,
        transparent,
        cyan,
        transparent
    );

    animation:cardScan 4s linear infinite;
}

@keyframes cardScan{

    from{left:-100%;}
    to{left:100%;}
}

.device:hover{

    transform:translateY(-6px);

    box-shadow:
        0 0 30px rgba(0,200,255,.2);
}

.icon{
    font-size:48px;
    margin-bottom:12px;
}

.device h3{
    margin-bottom:15px;
}

/* ================= STATUS ================= */

.status{

    display:inline-block;

    padding:8px 22px;

    border-radius:30px;

    margin-bottom:18px;

    font-weight:bold;
}

.off{

    color:#ff7080;

    background:rgba(160,0,30,.2);
}

.on{

    color:#35ffae;

    background:rgba(0,160,80,.2);

    box-shadow:
        0 0 20px rgba(0,255,150,.35);
}

/* ================= BUTTON ================= */

.controlButton{

    width:100%;

    padding:13px;

    border:none;

    border-radius:10px;

    background:#132440;

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.controlButton:hover{

    background:#1d4775;

    box-shadow:
        0 0 15px rgba(0,200,255,.25);
}

/* ================= ALL CONTROL ================= */

.allControls{

    display:flex;

    gap:15px;

    justify-content:center;

    margin-top:20px;
}

.allControls button{

    padding:14px 30px;

    border:none;

    border-radius:12px;

    color:white;

    background:#132440;

    font-weight:bold;

    cursor:pointer;
}

.allControls button:hover{
    background:#1d4775;
}

/* ================= AI STATUS ================= */

.aiStatus{

    text-align:center;

    color:#80edff;

    line-height:2;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .logo{
        font-size:36px;
        letter-spacing:7px;
    }

    .subtitle{
        font-size:12px;
        letter-spacing:3px;
    }

    .allControls{
        flex-direction:column;
    }

    .allControls button{
        width:100%;
    }
}

</style>

</head>


<body>

<!-- AI ANIMATED BACKGROUND -->

<div class="ai-background">

    <div class="grid"></div>

    <div class="scan"></div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
    <div class="particle p8"></div>

</div>


<div class="container">

<header>

    <div class="logo">
        AJATRON
    </div>

    <div class="subtitle">
        AI SMART HOME CONTROL
    </div>

    <div
        id="connection"
        class="connection"
    >
        🟠 Connecting...
    </div>

</header>


<!-- VOICE PANEL -->

<section class="panel">

    <h2>🎤 AI VOICE CONTROLLER</h2>

    <button
        class="voiceButton"
        onclick="startVoice()"
    >
        🎤 START VOICE
    </button>

    <div
        id="voiceText"
        class="voiceText"
    >
        Say "Turn on light 1"
    </div>

</section>


<!-- DEVICES -->

<section class="devices">


<!-- DEVICE 1 -->

<div class="device">

    <div class="icon">💡</div>

    <h3>LIGHT 1</h3>

    <div
        id="status1"
        class="status off"
    >
        OFF
    </div>

    <button
        id="button1"
        class="controlButton"
        onclick="toggleRelay(1)"
    >
        TURN ON
    </button>

</div>


<!-- DEVICE 2 -->

<div class="device">

    <div class="icon">💡</div>

    <h3>LIGHT 2</h3>

    <div
        id="status2"
        class="status off"
    >
        OFF
    </div>

    <button
        id="button2"
        class="controlButton"
        onclick="toggleRelay(2)"
    >
        TURN ON
    </button>

</div>


<!-- DEVICE 3 -->

<div class="device">

    <div class="icon">🔌</div>

    <h3>DEVICE 3</h3>

    <div
        id="status3"
        class="status off"
    >
        OFF
    </div>

    <button
        id="button3"
        class="controlButton"
        onclick="toggleRelay(3)"
    >
        TURN ON
    </button>

</div>


<!-- DEVICE 4 -->

<div class="device">

    <div class="icon">🌀</div>

    <h3>DEVICE 4</h3>

    <div
        id="status4"
        class="status off"
    >
        OFF
    </div>

    <button
        id="button4"
        class="controlButton"
        onclick="toggleRelay(4)"
    >
        TURN ON
    </button>

</div>

</section>


<!-- ALL CONTROL -->

<section class="panel">

    <h2>⚡ MASTER CONTROL</h2>

    <div class="allControls">

        <button onclick="allOn()">
            ⚡ ALL ON
        </button>

        <button onclick="allOff()">
            ⛔ ALL OFF
        </button>

    </div>

</section>


<!-- AI SYSTEM -->

<section class="panel">

    <div class="aiStatus">

        🤖 AJATRON AI SYSTEM<br>

        <span id="assistantText">
            Initializing smart home system...
        </span>

    </div>

</section>

</div>


<script>

/* =====================================================
   HIVEMQ SETTINGS
   ===================================================== */

const MQTT_HOST =
    "2ed680f152fb4eb39e590ed9803a3a63.s1.eu.hivemq.cloud";

const MQTT_PORT = 8884;

const MQTT_USERNAME =
    "ajatrontest";

const MQTT_PASSWORD =
    "@Ajay1234";


/* =====================================================
   TOPICS
   ===================================================== */

const COMMAND_TOPIC =
    "ajatron/home/command";

const STATE_TOPIC =
    "ajatron/home/state";


/* =====================================================
   MQTT CONNECTION
   ===================================================== */

const client =
    mqtt.connect(
        `wss://${MQTT_HOST}:${MQTT_PORT}/mqtt`,
        {
            username:MQTT_USERNAME,
            password:MQTT_PASSWORD,

            clientId:
                "AJATRON-WEB-" +
                Math.random()
                    .toString(16)
                    .substring(2),

            clean:true,

            reconnectPeriod:3000
        }
    );


/* =====================================================
   CONNECTED
   ===================================================== */

client.on("connect",function(){

    document.getElementById(
        "connection"
    ).innerHTML =
        "🟢 ONLINE";

    document.getElementById(
        "assistantText"
    ).innerText =
        "AJATRON AI is online and ready.";

    client.subscribe(
        STATE_TOPIC
    );

});


/* =====================================================
   OFFLINE
   ===================================================== */

client.on("offline",function(){

    document.getElementById(
        "connection"
    ).innerHTML =
        "🟠 RECONNECTING...";
});


/* =====================================================
   ERROR
   ===================================================== */

client.on("error",function(error){

    console.log(error);

    document.getElementById(
        "connection"
    ).innerHTML =
        "🔴 MQTT ERROR";
});


/* =====================================================
   RECEIVE STATE
   ===================================================== */

client.on(
    "message",
    function(topic,message){

        if(topic !== STATE_TOPIC){
            return;
        }

        try{

            const data =
                JSON.parse(
                    message.toString()
                );

            updateRelay(
                1,
                data.relay1
            );

            updateRelay(
                2,
                data.relay2
            );

            updateRelay(
                3,
                data.relay3
            );

            updateRelay(
                4,
                data.relay4
            );

        }

        catch(error){

            console.log(
                "State error:",
                error
            );
        }
    }
);


/* =====================================================
   SEND COMMAND
   ===================================================== */

function sendCommand(command){

    if(!client.connected){

        alert(
            "AJATRON is not connected."
        );

        return;
    }

    client.publish(
        COMMAND_TOPIC,
        command
    );
}


/* =====================================================
   TOGGLE
   ===================================================== */

function toggleRelay(number){

    const status =
        document.getElementById(
            "status"+number
        );

    const isOn =
        status.classList.contains(
            "on"
        );

    if(isOn){

        sendCommand(
            "R"+number+"OFF"
        );

    }else{

        sendCommand(
            "R"+number+"ON"
        );
    }
}


/* =====================================================
   UPDATE UI
   ===================================================== */

function updateRelay(number,state){

    const status =
        document.getElementById(
            "status"+number
        );

    const button =
        document.getElementById(
            "button"+number
        );

    if(Number(state) === 1){

        status.innerText = "ON";

        status.classList.remove(
            "off"
        );

        status.classList.add(
            "on"
        );

        button.innerText =
            "TURN OFF";

    }else{

        status.innerText = "OFF";

        status.classList.remove(
            "on"
        );

        status.classList.add(
            "off"
        );

        button.innerText =
            "TURN ON";
    }
}


/* =====================================================
   ALL ON
   ===================================================== */

function allOn(){

    sendCommand("ALLON");

    speak(
        "All devices turned on"
    );
}


/* =====================================================
   ALL OFF
   ===================================================== */

function allOff(){

    sendCommand("ALLOFF");

    speak(
        "All devices turned off"
    );
}


/* =====================================================
   VOICE
   ===================================================== */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "Use Google Chrome for voice control."
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-US";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    document.getElementById(
        "voiceText"
    ).innerText =
        "🎤 LISTENING...";

    recognition.start();


    recognition.onresult =
        function(event){

            const text =
                event
                    .results[0][0]
                    .transcript
                    .toLowerCase();

            document.getElementById(
                "voiceText"
            ).innerText =
                "You said: " + text;

            processVoice(text);
        };


    recognition.onerror =
        function(){

            document.getElementById(
                "voiceText"
            ).innerText =
                "Voice error. Try again.";
        };
}


/* =====================================================
   VOICE COMMAND PROCESSOR
   ===================================================== */

function processVoice(text){

    /* ALL ON */

    if(
        text.includes("all on") ||
        text.includes("everything on")
    ){

        allOn();

        return;
    }


    /* ALL OFF */

    if(
        text.includes("all off") ||
        text.includes("everything off")
    ){

        allOff();

        return;
    }


    /* LIGHT 1 */

    if(
        text.includes("light 1") ||
        text.includes("relay 1") ||
        text.includes("device 1")
    ){

        if(text.includes("on")){

            sendCommand("R1ON");

            speak(
                "Light one turned on"
            );

            return;
        }

        if(text.includes("off")){

            sendCommand("R1OFF");

            speak(
                "Light one turned off"
            );

            return;
        }
    }


    /* LIGHT 2 */

    if(
        text.includes("light 2") ||
        text.includes("relay 2") ||
        text.includes("device 2")
    ){

        if(text.includes("on")){

            sendCommand("R2ON");

            speak(
                "Light two turned on"
            );

            return;
        }

        if(text.includes("off")){

            sendCommand("R2OFF");

            speak(
                "Light two turned off"
            );

            return;
        }
    }


    /* DEVICE 3 */

    if(
        text.includes("light 3") ||
        text.includes("relay 3") ||
        text.includes("device 3")
    ){

        if(text.includes("on")){

            sendCommand("R3ON");

            speak(
                "Device three turned on"
            );

            return;
        }

        if(text.includes("off")){

            sendCommand("R3OFF");

            speak(
                "Device three turned off"
            );

            return;
        }
    }


    /* DEVICE 4 */

    if(
        text.includes("light 4") ||
        text.includes("relay 4") ||
        text.includes("device 4")
    ){

        if(text.includes("on")){

            sendCommand("R4ON");

            speak(
                "Device four turned on"
            );

            return;
        }

        if(text.includes("off")){

            sendCommand("R4OFF");

            speak(
                "Device four turned off"
            );

            return;
        }
    }


    speak(
        "I did not understand the command"
    );
}


/* =====================================================
   AI VOICE RESPONSE
   ===================================================== */

function speak(text){

    if(
        "speechSynthesis" in window
    ){

        const speech =
            new SpeechSynthesisUtterance(
                text
            );

        speech.lang =
            "en-US";

        speech.rate =
            1;

        window.speechSynthesis.speak(
            speech
        );
    }
}

</script>

</body>
</html>
